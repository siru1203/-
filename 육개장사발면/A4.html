<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A4 - 회원가입 폼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="register.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="signup-container w-full max-w-md bg-white rounded-2xl shadow-xl p-8 space-y-6">
        
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-gray-800">계정 만들기</h1>
            <p class="text-sm text-gray-500">정보를 입력하여 회원가입을 완료하세요.</p>
        </div>

        <form class="space-y-4" onsubmit="event.preventDefault();">
            
            <div class="space-y-1">
                <label for="username" class="block text-sm font-medium text-gray-700 text-left">이름 <span class="text-red-500">*</span></label>
                <input type="text" id="username" name="username" required 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"
                    placeholder="홍길동">
            </div>

            <div class="space-y-1">
                <label for="email" class="block text-sm font-medium text-gray-700 text-left">이메일 <span class="text-red-500">*</span></label>
                <input type="email" id="email" name="email" required 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"
                    placeholder="example@email.com">
            </div>

            <div class="space-y-1">
                <label for="password" class="block text-sm font-medium text-gray-700 text-left">비밀번호 <span class="text-red-500">*</span></label>
                <input type="password" id="password" name="password" required 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"
                    placeholder="비밀번호 입력">
            </div>

            <div class="space-y-1">
                <label for="password-confirm" class="block text-sm font-medium text-gray-700 text-left">비밀번호 확인 <span class="text-red-500">*</span></label>
                <input type="password" id="password-confirm" name="password-confirm" required 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"
                    placeholder="비밀번호 재입력">
            </div>

            <button type="submit" class="w-full py-3 rounded-lg font-semibold text-white bg-indigo-600 hover:bg-indigo-700 shadow-md transition-all duration-200 mt-4 cursor-pointer">
                회원가입
            </button>

        </form>
    </div>

</body>
</html>
